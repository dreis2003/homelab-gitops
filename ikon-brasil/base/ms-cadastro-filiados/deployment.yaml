apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-cadastro-filiados
  labels:
    app: ms-cadastro-filiados
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-cadastro-filiados
  template:
    metadata:
      labels:
        app: ms-cadastro-filiados
    spec:
      containers:
        - name: ms-cadastro-filiados
          image: ghcr.io/dreis2003/ms-cadastro-filiados:hml-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "hml"

            - name: SERVER_PORT
              value: "8080"

            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: ms-cadastro-filiados-secrets
                  key: DB_URL

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ms-cadastro-filiados-secrets
                  key: DB_USERNAME

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ms-cadastro-filiados-secrets
                  key: DB_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ms-cadastro-filiados-secrets
                  key: JWT_SECRET

            - name: MS_AUTH_URL
              value: "http://ms-auth:8080"

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"