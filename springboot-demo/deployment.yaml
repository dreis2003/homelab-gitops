apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-demo
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springboot-demo
  template:
    metadata:
      labels:
        app: springboot-demo
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: springboot-demo
          image: ghcr.io/dreis2003/springboot-demo-ci:c5b2627350e7bc225163b4c999188e03b9ae26bf
          ports:
            - containerPort: 8080