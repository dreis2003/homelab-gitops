apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-demo
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springboot-demo
  template:
    metadata:
      labels:
        app: springboot-demo
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: springboot-demo
          image: ghcr.io/dreis2003/springboot-demo:1.0
          ports:
            - containerPort: 8080
