apiVersion: apps/v1
kind: Deployment
metadata:
  name: ykanban-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ykanban-api
  template:
    metadata:
      labels:
        app: ykanban-api
    spec:
      containers:
        - name: ykanban-api
          image: ghcr.io/dreis2003/ykanban-backend:hml-latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          env:
            - name: SERVER_PORT
              value: "8080"

            - name: TZ
              value: "America/Sao_Paulo"

            - name: JAVA_TOOL_OPTIONS
              value: "-Duser.timezone=America/Sao_Paulo"

            - name: SPRING_PROFILES_ACTIVE
              value: "hml"

            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: ykanban-api-secrets
                  key: DB_URL

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ykanban-api-secrets
                  key: DB_USERNAME

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ykanban-api-secrets
                  key: DB_PASSWORD

            - name: SPRING_FLYWAY_URL
              valueFrom:
                secretKeyRef:
                  name: ykanban-api-secrets
                  key: DB_URL

            - name: SPRING_FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: ykanban-api-secrets
                  key: DB_USERNAME

            - name: SPRING_FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ykanban-api-secrets
                  key: DB_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ykanban-api-secrets
                  key: JWT_SECRET
