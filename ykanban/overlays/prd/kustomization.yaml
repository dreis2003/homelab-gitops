apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ykanban-prd

resources:
- namespace.yaml
- ../../base/ykanban-api
- ../../base/ykanban-web
- ../../base/ingress-prd

images:
- name: ghcr.io/dreis2003/ykanban-backend
  newName: ghcr.io/dreis2003/ykanban-backend
  newTag: prd-latest
- name: ghcr.io/dreis2003/ykanban-frontend
  newName: ghcr.io/dreis2003/ykanban-frontend
  newTag: prd-latest

patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ykanban-api
    spec:
      template:
        spec:
          containers:
            - name: ykanban-api
              env:
                - name: SPRING_PROFILES_ACTIVE
                  value: "prd"
  target:
    kind: Deployment
    name: ykanban-api
