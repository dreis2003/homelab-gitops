- name: ghcr.io/dreis2003/ms-sorteio
  newName: ghcr.io/dreis2003/ms-sorteio
  newTag: prd-f00718436c949b62becf5482f3d545d54115bcac

patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ms-sorteio
