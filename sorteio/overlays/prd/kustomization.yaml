apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sorteio-prd

resources:
- ../../base/ms-sorteio
- ../../base/mfe-sorteio
- ../../base/ingress-prd

images:
- name: ghcr.io/dreis2003/mfe-sorteio
  newName: ghcr.io/dreis2003/mfe-sorteio
  newTag: prd-ff479edac7dd16c0d2b6f2eb1d71aab4927da719
- name: ghcr.io/dreis2003/ms-sorteio
  newName: ghcr.io/dreis2003/ms-sorteio
  newTag: prd-4438c9e9971e155049f37d4fa77273bdb382bfed

patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ms-sorteio
    spec:
      template:
        spec:
          containers:
            - name: ms-sorteio
              env:
                - name: SPRING_PROFILES_ACTIVE
                  value: "prd"
  target:
    kind: Deployment
    name: ms-sorteio
