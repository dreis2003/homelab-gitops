apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sorteio-prd

resources:
- ../../base/ms-sorteio
- ../../base/mfe-sorteio
- ../../base/ingress-prd

images:
- name: ghcr.io/dreis2003/mfe-sorteio
  newName: ghcr.io/dreis2003/mfe-sorteio
  newTag: prd-70d64341fa7eaeb74b605f2d5e4b3706571b3d3b
- name: ghcr.io/dreis2003/ms-sorteio
  newName: ghcr.io/dreis2003/ms-sorteio
  newTag: prd-fc471ae11b4551902e9cbdc497110d2921d43163

patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ms-sorteio
    spec:
      template:
        spec:
          containers:
            - name: ms-sorteio
              env:
                - name: SPRING_PROFILES_ACTIVE
                  value: "prd"
  target:
    kind: Deployment
    name: ms-sorteio
