apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sorteio-prd

resources:
- ../../base/ms-sorteio
- ../../base/mfe-sorteio
- ../../base/ingress-prd

images:
- name: ghcr.io/dreis2003/mfe-sorteio
  newName: ghcr.io/dreis2003/mfe-sorteio
  newTag: prd-d7df0db9d3f49b88227a6785f9165b1b238b110b
- name: ghcr.io/dreis2003/ms-sorteio
  newName: ghcr.io/dreis2003/ms-sorteio
  newTag: prd-67596854f57763cc77554689d56718a7603c9392

patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ms-sorteio
    spec:
      template:
        spec:
          containers:
            - name: ms-sorteio
              env:
                - name: SPRING_PROFILES_ACTIVE
                  value: "prd"
  target:
    kind: Deployment
    name: ms-sorteio
